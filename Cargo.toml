[package]
name = "calcdex"
version = "0.2.0"
edition = "2021"
rust-version = "1.80"
authors = ["Sean Shaffer"]
description = "CalcDex — the ultimate offline calculator: every kind of calculation from Omni Calculator and the Nutilz calculator set, in one Windows program."
license = "MIT"
keywords = ["windows", "calculator", "math", "finance", "converter"]
categories = ["gui"]

[lib]
name = "calcdex"
path = "src/lib.rs"

[[bin]]
name = "CalcDex"
path = "src/main.rs"

[dependencies]
egui = { version = "0.33", default-features = false, features = ["default_fonts"] }
eframe = { version = "0.33", default-features = false, features = ["default_fonts", "glow", "accesskit"] }

[target.'cfg(not(windows))'.dependencies]
eframe = { version = "0.33", default-features = false, features = ["default_fonts", "glow", "accesskit", "x11"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
